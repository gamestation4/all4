<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME STATION STORE— PS4 GoldHEN</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        :root {
            --bg: #02060b;
            --panel: rgba(7, 15, 25, .97);
            --panel2: rgba(12, 24, 38, .96);
            --orange: #ff6a00;
            --orange2: #ff941f;
            --cyan: #b8eee9;
            --white: #f8fafc;
            --muted: #9aa9b9;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% -10%, rgba(255, 106, 0, .18), transparent 38%),
                radial-gradient(circle at 0% 100%, rgba(184, 238, 233, .08), transparent 32%),
                linear-gradient(135deg, #02050a 0%, #081522 52%, #02060b 100%);
            color: var(--white);
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .14;
            background-image:
                linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
            background-size: 36px 36px;
        }

        body::after {
            content: "";
            position: fixed;
            width: 620px;
            height: 620px;
            border-radius: 50%;
            border: 1px solid rgba(255, 106, 0, .10);
            box-shadow:
                0 0 0 30px rgba(255, 106, 0, .025),
                0 0 0 60px rgba(184, 238, 233, .015);
            pointer-events: none;
        }

        body>h1:not(#msgs),
        body>hr,
        body>br {
            display: none;
        }

        .brand-card {
            position: fixed;
            z-index: 5;
            top: 4.5vh;
            left: 50%;
            transform: translateX(-50%);
            width: min(92vw, 760px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
        }

        .brand-logo {
            display: block;
            width: min(270px, 54vw);
            height: auto;
            object-fit: contain;
            filter:
                drop-shadow(0 16px 25px rgba(0, 0, 0, .60)) drop-shadow(0 0 18px rgba(255, 106, 0, .10));
        }

        .brand-line {
            width: min(430px, 72vw);
            height: 2px;
            margin-top: -2px;
            background: linear-gradient(90deg, transparent, var(--orange), var(--cyan), var(--orange), transparent);
            opacity: .8;
        }

        .brand-label {
            margin-top: 9px;
            color: var(--cyan);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: .28em;
            text-transform: uppercase;
            opacity: .9;
        }

        #msgs {
            position: fixed;
            z-index: 4;
            left: 50%;
            bottom: 7vh;
            transform: translateX(-50%);
            width: min(86vw, 650px);
            margin: 0 !important;
            padding: 20px 28px !important;
            border: 1px solid rgba(255, 106, 0, .45);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(8, 20, 33, .98), rgba(3, 9, 16, .98));
            box-shadow:
                0 18px 55px rgba(0, 0, 0, .55),
                inset 0 1px 0 rgba(255, 255, 255, .06),
                0 0 30px rgba(255, 106, 0, .06);
            color: var(--white) !important;
            text-align: center;
            font-size: clamp(15px, 2.2vw, 20px) !important;
            line-height: 1.45;
            font-weight: 700;
            letter-spacing: .03em;
        }

        #msgs::before {
            content: "GOLDHEN";
            display: block;
            margin-bottom: 7px;
            color: var(--orange2);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .35em;
        }

        body>h1:last-child {
            position: fixed;
            z-index: 3;
            bottom: 1.7vh;
            left: 50%;
            transform: translateX(-50%);
            margin: 0 !important;
            color: var(--muted);
            font-size: 10px !important;
            font-weight: 600;
            letter-spacing: .08em;
            opacity: .55;
            white-space: nowrap;
        }

        body>h1:last-child a {
            color: var(--muted) !important;
        }

        @media (max-width: 600px) {
            .brand-card {
                top: 5vh;
            }

            .brand-logo {
                width: min(230px, 58vw);
            }

            .brand-label {
                font-size: 10px;
                letter-spacing: .20em;
            }

            #msgs {
                bottom: 8vh;
                width: 90vw;
                padding: 18px 16px !important;
            }

            body>h1:last-child {
                max-width: 90vw;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }
    </style>
</head>

<body>

    <script>
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        function onScriptError() {
            msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
        }

        if (!isPS4) {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 13.52";
            });
        } else {
            if (window.applicationCache.status == '0') {
                if (fwNum == 5.05 || fwNum == 5.07) {
                    window.location.replace("cache505.html");
                } else if (fwNum >= 7.00 && fwNum <= 8.52) {
                    window.location.replace("cache700.html");
                } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    window.location.replace("cache900.html");
                } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    window.location.replace("cachecss.html");
                } else if (fwNum >= 11.50 && fwNum <= 13.52) {
                    window.location.replace("cacheslopkit.html");
                } else {
                    document.addEventListener("DOMContentLoaded", () => {
                        msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
                    });
                }
            } else {
                if (fwNum == 5.05 || fwNum == 5.07) {
                    var script = document.createElement('script');
                    script.src = "505/exploit.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 7.00 && fwNum <= 8.52) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "700/alert.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "900/alert.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    var script = document.createElement('script');
                    script.src = "css/main.js";
                    script.onerror = onScriptError;
                    script.onload = function () {
                        setTimeout(function () {
                            doJb();
                        }, 500);
                    };
                    document.head.appendChild(script);
                }
                else if (fwNum >= 11.50 && fwNum <= 12.02) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_lapse.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 12.50 && fwNum <= 13.00) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_poops.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 13.02 && fwNum <= 13.52) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/jb.js?v=10";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
            }
        }
    </script>
